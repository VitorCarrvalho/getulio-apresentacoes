:root{--bg:#141416;--bg2:#1A1A1D;--line:#2C2C31;--deep:#0E0E10;--gold:#D4AF37;--cream:#F5F2EA;--mut:#8F8A82;--mut2:#6B665E;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--cream);font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{width:min(1640px,100%);margin:0 auto;padding:clamp(22px,4vw,64px) clamp(18px,4vw,64px) 80px}
.in{opacity:0;transform:translateY(18px);filter:blur(6px);animation:in .9s var(--ease) forwards;animation-delay:calc(var(--d,0) * 1s)}
@keyframes in{to{opacity:1;transform:none;filter:none}}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.k{color:var(--gold);font-weight:700;letter-spacing:.32em;font-size:12px}
h1{font-size:clamp(34px,4.2vw,64px);line-height:1.05;font-weight:700;margin-top:12px}
h1 span{color:var(--gold)}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;color:var(--mut);font-size:clamp(19px,1.6vw,24px);margin-top:8px}
.out{color:var(--mut);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.2em;border:1px solid var(--line);border-radius:999px;padding:11px 18px;transition:color .3s,border-color .3s}
.out:hover{color:var(--cream);border-color:var(--mut2)}

.bar{margin-top:clamp(28px,3.5vw,48px);display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:13px 18px 13px 44px;font-size:15px;outline:none;transition:border-color .3s}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2}
.group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group .lbl{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--mut2);margin-right:4px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:color .25s,border-color .25s,background .25s}
.chip:hover{color:var(--cream);border-color:var(--mut2)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#141416}
.chip.star[aria-pressed="true"]{background:transparent;color:var(--gold);border-color:var(--gold)}
.count{margin-left:auto;font-size:13px;color:var(--mut2)}

.grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:clamp(18px,2vw,28px)}
.card{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.card:hover{transform:translateY(-4px);border-color:rgba(212,175,55,.55);box-shadow:0 22px 50px -24px rgba(0,0,0,.8)}
.card a.open{position:absolute;inset:0;z-index:1;border-radius:16px}
.card a.open:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/9;background:var(--deep);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.card:hover .thumb img{transform:scale(1.03)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;padding:12%}
.thumb .ph img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.thumb .ph b{font-size:15px;letter-spacing:.3em;color:var(--mut2)}
.tags{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;z-index:2;pointer-events:none}
.tag{background:rgba(20,20,22,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 11px;font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--cream)}
.tag.g{color:var(--gold)}
.fav{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(20,20,22,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;transition:border-color .3s}
.fav svg{width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.8;transition:fill .3s,stroke .3s}
.fav:hover svg{stroke:var(--cream)}
.fav[aria-pressed="true"]{border-color:rgba(212,175,55,.6)}
.fav[aria-pressed="true"] svg{fill:var(--gold);stroke:var(--gold)}
.info{display:flex;gap:16px;align-items:center;padding:18px 20px 20px}
.lg{flex:0 0 auto;width:64px;height:64px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;padding:8px}
.lg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lg b{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.txt{min-width:0}
.ev{font-size:17px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.city{font-size:13px;color:var(--mut);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:14px;margin-top:9px;font-size:12px;font-weight:600;color:var(--mut2);letter-spacing:.04em;flex-wrap:wrap}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--mut)}
.empty b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:28px;color:var(--cream);margin-bottom:8px}
.past{opacity:.62}
[hidden]{display:none!important}
.tabs{margin-top:clamp(24px,3vw,40px);display:flex;gap:8px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 18px 14px;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--mut);cursor:pointer;margin-bottom:-1px;transition:color .25s,border-color .25s}
.tab:hover{color:var(--cream)}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tab span{display:inline-block;min-width:22px;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--gold);color:#141416;font-size:12px}
.tab span:empty{display:none}
body.ras .bar{display:none}
.acts{display:flex;gap:10px;padding:0 20px 20px;position:relative;z-index:2}
.btn{flex:1;border-radius:999px;padding:12px 16px;font-size:13px;font-weight:700;letter-spacing:.12em;text-align:center;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--cream);transition:border-color .25s,background .25s,color .25s}
.btn:hover{border-color:var(--mut2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#141416}
.btn.gold:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:default}
.note{padding:0 20px 18px;font-size:12px;color:var(--mut);line-height:1.5}
.tag.r{color:#141416;background:var(--gold);border-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--bg2);border:1px solid var(--gold);color:var(--cream);border-radius:14px;padding:14px 22px;font-size:14px;max-width:min(560px,90vw);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s var(--ease);z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none;filter:none}}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <div class="k in" style="--d:.1">CATÁLOGO</div>
      <h1 class="in" style="--d:.2">Apresentações <span>Getúlio Cavalcante</span></h1>
      <div class="sub in" style="--d:.3">Escolha a palestra e clique para abrir.</div>
    </div>
    <a class="out in" style="--d:.4" href="/api/sair">SAIR</a>
  </header>

  <nav class="tabs in" style="--d:.42">
    <button class="tab" id="tabCat" aria-selected="true">Catálogo</button>

  </nav>

  <div class="bar in" style="--d:.45">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por evento, cliente ou cidade" aria-label="Buscar"></label>
    <div class="group" id="cats"><span class="lbl">CATEGORIA</span></div>

      <button class="chip star" id="onlyFav" aria-pressed="false">★ Favoritos</button>
      <button class="chip" id="showOld" aria-pressed="false">Mostrar temporárias e antigas</button>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="grid" id="gridRas" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</div>

const DATA = ALL.filter(c => !c.rascunho), RAS = ALL.filter(c => c.rascunho);
const CAT = { original: 'Original', empresa: 'Empresas', igreja: 'Igrejas', evento: 'Eventos' };
const CAT1 = { original: 'ORIGINAL', empresa: 'EMPRESA', igreja: 'IGREJA', evento: 'EVENTO' };
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtData = d => { const [y, m, dd] = (d || '').split('-'); return y ? `${dd} ${MES[+m - 1]} ${y}` : ''; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('lds-favoritos') || '[]')); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem('lds-favoritos', JSON.stringify([...favs])); } catch (e) {} };

/* temporária: sai do catálogo depois da data do evento (o link continua valendo) */
const escondida = c => c.arquivada || (!c.fixa && (!c.data || c.data < hoje));
const st = { q: '', cat: '', dur: 0, fav: false, old: false };

function chips(el, items, key) {
  items.forEach(([v, label]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { st[key] = st[key] === v ? (key === 'dur' ? 0 : '') : v;
      el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b && st[key] === v ? 'true' : 'false')); render(); };
    el.appendChild(b);
  });
}
chips(document.getElementById('cats'), Object.keys(CAT).filter(k => DATA.some(c => c.categoria === k)).map(k => [k, CAT[k]]), 'cat');
chips(document.getElementById('durs'), [...new Set(DATA.map(c => c.duracao).filter(Boolean))].sort((a, b) => a - b).map(d => [d, d + ' min']), 'dur');
const tog = (id, key) => { const b = document.getElementById(id); b.onclick = () => { st[key] = !st[key]; b.setAttribute('aria-pressed', st[key]); render(); }; };
tog('onlyFav', 'fav'); tog('showOld', 'old');
document.getElementById('q').oninput = e => { st.q = norm(e.target.value.trim()); render(); };

const IC = {
  star: '<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z" stroke-linejoin="round"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};

function render() {
  let list = DATA.filter(c => (st.old || !escondida(c))
    && (!st.cat || c.categoria === st.cat) && (!st.dur || c.duracao === st.dur) && (!st.fav || favs.has(c.slug))
    && (!st.q || norm([c.evento, c.cliente, c.cidade, c.titulo, CAT1[c.categoria]].join(' ')).includes(st.q)));
  list.sort((a, b) => (favs.has(b.slug) - favs.has(a.slug)) || ((a.categoria === 'original' ? 0 : 1) - (b.categoria === 'original' ? 0 : 1)) || String(b.data).localeCompare(String(a.data)));
  const g = document.getElementById('grid');
  document.getElementById('count').textContent = list.length === 1 ? '1 apresentação' : list.length + ' apresentações';
  if (!list.length) { g.innerHTML = '<div class="empty"><b>Nada por aqui.</b>Mude os filtros ou a busca.</div>'; return; }
  g.innerHTML = list.map((c, i) => {
    const nome = c.evento || c.titulo;
    const thumb = c.capa ? `<img src="${c.slug}/capa.webp" alt="" loading="lazy">`
      : `<div class="ph">${c.logo ? `<img src="${c.logo}" alt="">` : '<b>GETÚLIO CAVALCANTE</b>'}</div>`;
    const lg = c.logo ? `<img src="${c.logo}" alt="${esc(c.cliente)}">` : '<b>GC</b>';
    const tags = `<span class="tag ${c.categoria === 'original' ? 'g' : ''}">${CAT1[c.categoria]}</span>` + (c.arquivada ? '<span class="tag">ARQUIVADA</span>' : !c.fixa ? '<span class="tag">TEMPORÁRIA</span>' : '');
    const meta = [c.data ? `<span>${IC.cal}${fmtData(c.data)}</span>` : '', c.duracao ? `<span>${IC.clock}${c.duracao} min</span>` : '', `<span>${c.telas} telas</span>`].join('');
    return `<article class="card in${escondida(c) ? ' past' : ''}" style="--d:${(0.5 + i * 0.06).toFixed(2)}">
      <a class="open" href="${c.slug}/" aria-label="Abrir ${esc(nome)}"></a>
      <div class="thumb">${thumb}<div class="tags">${tags}</div>
        <button class="fav" data-slug="${c.slug}" aria-pressed="${favs.has(c.slug)}" aria-label="Favoritar">${IC.star}</button></div>
      <div class="info"><div class="lg">${lg}</div><div class="txt">
        <div class="ev">${esc(nome)}</div>
        <div class="city">${c.cidade ? esc(c.cidade) : esc(c.titulo)}</div>
        <div class="meta">${meta}</div></div></div>
    </article>`;
  }).join('');
  g.querySelectorAll('.fav').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation(); const s = b.dataset.slug;
    favs.has(s) ? favs.delete(s) : favs.add(s); saveFavs();
    b.setAttribute('aria-pressed', favs.has(s));
    g.querySelectorAll('.card').forEach(c => { c.style.animation = 'none'; c.style.opacity = 1; c.style.transform = 'none'; c.style.filter = 'none'; });
    setTimeout(render, 250);
  });
}
render();

/* ---------- aba Rascunhos ---------- */
const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 7000); };
document.getElementById('nRas').textContent = RAS.length || '';
function aba(r) {
  document.body.classList.toggle('ras', r);
  document.getElementById('tabCat').setAttribute('aria-selected', !r); document.getElementById('tabRas').setAttribute('aria-selected', r);
  document.getElementById('grid').hidden = r; document.getElementById('gridRas').hidden = !r;
  document.getElementById('count').textContent = '';
  if (r) renderRas(); else render();
  try { history.replaceState(null, '', r ? '#rascunhos' : location.pathname); } catch (e) {}
}
document.getElementById('tabCat').onclick = () => aba(false);
document.getElementById('tabRas').onclick = () => aba(true);
function renderRas() {
  const g = document.getElementById('gridRas');
  if (!RAS.length) { g.innerHTML = '<div class="empty"><b>Nenhum rascunho.</b>Quando o Claude subir uma apresentação nova, ela aparece aqui antes de ir para o catálogo.</div>'; return; }
  g.innerHTML = RAS.map((c, i) => {
    const nome = c.evento || c.titulo;
    const thumb = c.capa ? `<img src="${c.slug}/capa.webp" alt="" loading="lazy">` : `<div class="ph">${c.logo ? `<img src="${c.logo}" alt="">` : '<b>GETÚLIO CAVALCANTE</b>'}</div>`;
    const alvo = c.substitui ? `Ao ativar, este rascunho vira a apresentação <b>${esc(c.substitui === 'original' ? 'Original' : c.substitui)}</b> do catálogo e a versão atual fica arquivada.` : 'Ao ativar, esta apresentação entra no catálogo.';
    return `<article class="card in" style="--d:${(0.2 + i * 0.06).toFixed(2)}">
      <div class="thumb">${thumb}<div class="tags"><span class="tag r">RASCUNHO</span></div></div>
      <div class="info"><div class="lg"><b>GC</b></div><div class="txt">
        <div class="ev">${esc(nome)}</div><div class="city">${esc(c.titulo)}</div>
        <div class="meta">${c.duracao ? `<span>${IC.clock}${c.duracao} min</span>` : ''}<span>${c.telas} telas</span></div></div></div>
      <div class="note">${alvo}</div>
      <div class="acts"><a class="btn" href="${c.slug}/">ABRIR</a><button class="btn gold" data-ativar="${c.slug}">ATIVAR</button></div>
    </article>`;
  }).join('');
  g.querySelectorAll('[data-ativar]').forEach(b => b.onclick = async () => {
    const c = RAS.find(x => x.slug === b.dataset.ativar);
    if (!confirm(`Ativar "${c.evento || c.titulo}"?` + (c.substitui ? '\n\nEle passa a ser a apresentação original do catálogo. A versão atual fica arquivada (continua acessível em "Mostrar temporárias e antigas").' : ''))) return;
    b.disabled = true; b.textContent = 'ATIVANDO...';
    try {
      const r = await fetch('/api/ativar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug: c.slug }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || 'Não deu certo.');
      b.textContent = 'ATIVADO'; toast('Ativado. Em 2 a 3 minutos o catálogo já mostra a nova versão. Atualize a página.');
    } catch (e) { b.disabled = false; b.textContent = 'ATIVAR'; toast(e.message); }
  });
}
if (location.hash === '#rascunhos') aba(true);
/* depois da primeira montagem, os cards não animam de novo a cada filtro */
setTimeout(() => document.head.insertAdjacentHTML('beforeend', '<style>.grid .card.in{animation:none;opacity:1;transform:none;filter:none}</style>'), 2500);
</script>
</body>
</html>
