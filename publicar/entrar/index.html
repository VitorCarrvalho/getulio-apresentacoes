:root{--bg:#141416;--bg2:#1A1A1D;--line:#2C2C31;--gold:#D4AF37;--cream:#F5F2EA;--mut:#8F8A82;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh;overflow:hidden}
.photo{position:relative;overflow:hidden;background:#0E0E10}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 20%;
  animation:photo 1.6s var(--ease) both}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,var(--bg) 100%)}
main{display:flex;align-items:center;padding:clamp(28px,7vw,120px)}
form{width:min(440px,100%)}
.in{opacity:0;transform:translateY(18px);filter:blur(6px);animation:in 1s var(--ease) forwards;animation-delay:calc(var(--d,0) * 1s)}
.k{color:var(--gold);font-weight:700;letter-spacing:.32em;font-size:13px}
h1{font-size:clamp(34px,4vw,54px);line-height:1.08;margin-top:14px;font-weight:700}
h1 span{color:var(--gold)}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;color:var(--mut);font-size:clamp(20px,1.8vw,26px);margin-top:12px}
label{display:block;margin-top:52px;font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--mut)}
.field{position:relative;margin-top:12px}
input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--cream);
  font:500 17px "Montserrat",system-ui,sans-serif;padding:17px 52px 17px 18px;outline:none;transition:border-color .3s}
input:focus{border-color:var(--gold)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;padding:10px;font-size:12px;font-weight:700;letter-spacing:.1em}
button.go{margin-top:18px;width:100%;border:0;border-radius:10px;background:var(--gold);color:#141416;
  font:700 14px "Montserrat",system-ui,sans-serif;letter-spacing:.24em;padding:18px;cursor:pointer;transition:filter .3s,transform .3s}
button.go:hover{filter:brightness(1.08)}
button.go:disabled{opacity:.6;cursor:wait}
.err{min-height:22px;margin-top:16px;color:#E07A6B;font-size:14px;font-weight:600}
.note{margin-top:30px;color:#6B665E;font-size:12px;line-height:1.6}
@keyframes in{to{opacity:1;transform:none;filter:none}}
@keyframes photo{from{opacity:0;transform:scale(1.06);filter:blur(10px) brightness(.6)}to{opacity:1;transform:none;filter:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
@media (max-width:820px){body{grid-template-columns:1fr}.photo{display:none}}
@media (prefers-reduced-motion:reduce){.in,.photo img{animation:none;opacity:1;transform:none;filter:none}}
</style>
</head>

<main>
  <form id="f" autocomplete="on">
    <div class="k in" style="--d:.2">APRESENTAÇÕES</div>
    <h1 class="in" style="--d:.35">Getúlio <span>Cavalcante</span></h1>
    <div class="sub in" style="--d:.5">Catálogo de palestras</div>
    <label class="in" style="--d:.7" for="t">TOKEN DE ACESSO</label>
    <div class="field in" style="--d:.8">
      <input id="t" name="token" type="password" autocomplete="current-password" required autofocus>
      <button class="eye" type="button" id="eye" aria-label="Mostrar token">VER</button>
    </div>
    <button class="go in" style="--d:.9" type="submit" id="go">ENTRAR</button>
    <div class="err" id="err" role="alert"></div>
    <p class="note in" style="--d:1.1">O acesso fica liberado neste navegador por 7 dias.</p>
  </form>
</main>
<script>
const q = new URLSearchParams(location.search);
const volta = (q.get('volta') || '').startsWith('/') && !(q.get('volta') || '').startsWith('//') ? q.get('volta') : '/apresentacoes/';
const f = document.getElementById('f'), t = document.getElementById('t'), err = document.getElementById('err'), go = document.getElementById('go');
document.getElementById('eye').onclick = e => { const v = t.type === 'password'; t.type = v ? 'text' : 'password'; e.target.textContent = v ? 'OCULTAR' : 'VER'; t.focus(); };
f.onsubmit = async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true;
  try {
    const r = await fetch('/api/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: t.value.trim() }), credentials: 'same-origin' });
    if (r.ok) { location.replace(volta); return; }
    const j = await r.json().catch(() => ({}));
    err.textContent = j.erro || 'Token inválido.';
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); t.select();
  } catch (x) { err.textContent = 'Sem conexão. Tente de novo.'; }
  go.disabled = false;
};
</script>
</body>
</html>
