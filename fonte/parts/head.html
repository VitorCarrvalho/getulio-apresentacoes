<style>
{{FONTS}}
:root{
  /* Grade de desenho 16:9 (1778 x 1000). --u escala pelo menor eixo; telas mais largas (3:1) ganham espaço horizontal. */
  --gw:1778; --gh:1000;
  --u:min(calc(100vw / var(--gw)), calc(100vh / var(--gh)));
  --bg:#141416; --bg2:#1A1A1D; --line:#2C2C31; --deep:#0E0E10;
  --gold:#D4AF37; --goldD:#8A6D16; --cream:#F5F2EA; --mut:#8F8A82; --mut2:#6B665E; --sand:#E4DCCB;
  --ease:cubic-bezier(.22,1,.36,1); --ease2:cubic-bezier(.65,0,.35,1);
  --sans:"Montserrat",system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
  --pad:107u; --frame:2400u;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.idle{cursor:none}
b,strong{font-weight:700}
.g{color:var(--gold)} .c{color:var(--cream)} .m{color:var(--mut)} .d{color:var(--bg)}
.serif{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:0}
.bold{font-weight:700}

/* ---------- Palco ---------- */
#deck{position:fixed;inset:0;z-index:3}
.slide{position:absolute;inset:0;overflow:hidden;background:var(--bg);
  opacity:0;visibility:hidden;transform:scale(1.035);filter:blur(10u);
  transition:opacity .9s var(--ease),transform 1.3s var(--ease),filter .9s var(--ease),visibility 0s 1.3s}
.slide.on{opacity:1;visibility:visible;transform:none;filter:none;z-index:2;
  transition:opacity 1s var(--ease) .12s,transform 1.5s var(--ease) .12s,filter 1s var(--ease) .12s,visibility 0s}
.slide.past{transform:scale(.975)}
/* transição só de luz (sequências que se continuam) */
.slide[data-tr="fade"]{transform:none;filter:none;transition:opacity .7s var(--ease2),visibility 0s .7s}
.slide[data-tr="fade"].on{transition:opacity .8s var(--ease2) .15s,visibility 0s}
/* slides dourados: a cor abre do centro */
.slide.goldbg{background:transparent;transform:none;filter:none;transition:opacity .9s var(--ease),visibility 0s .9s}
.slide.goldbg.on{transition:opacity .25s linear,visibility 0s}
.slide.goldbg::before{content:"";position:absolute;inset:0;background:var(--gold);clip-path:circle(0% at 50% 55%);transition:clip-path 0s .9s}
.slide.goldbg.on::before{clip-path:circle(80% at 50% 55%);transition:clip-path 1.25s var(--ease2) .05s}
.slide.cream{background:var(--cream);color:var(--bg)}

.frame{position:relative;z-index:2;height:100%;width:min(100%,var(--frame));margin:0 auto;padding:100u var(--pad) 120u;display:flex;flex-direction:column}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.center{align-items:center;text-align:center}

/* ---------- Entradas (tocam uma vez e param) ---------- */
.in{opacity:0;transform:translateY(34u);filter:blur(8u);transition:opacity .9s var(--ease),transform 1.2s var(--ease),filter .9s var(--ease)}
.slide.on .in{opacity:1;transform:none;filter:none;transition-delay:calc(var(--d,0) * 1s + .45s)}
.w{display:inline-block;opacity:0;transform:translateY(38%);filter:blur(9u);transition:opacity 1s var(--ease),transform 1.2s var(--ease),filter 1s var(--ease)}
.slide.on .w{opacity:1;transform:none;filter:none}
/* Builds por clique: data-show="n" (a partir do passo n) · data-only="n" (só no passo n) */
.bx{opacity:0;transform:translateY(30u);filter:blur(8u);pointer-events:none;
  transition:opacity .6s var(--ease),transform .9s var(--ease),filter .6s var(--ease)}
.bx.vis{opacity:1;transform:none;filter:none;pointer-events:auto;transition:opacity .9s var(--ease) .25s,transform 1.2s var(--ease) .25s,filter .9s var(--ease) .25s}

/* ---------- Tipografia ---------- */
.k{font-weight:700;font-size:26u;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);line-height:1.2}
.cream .k{color:var(--goldD)}
h1,h2,h3,.h{font-weight:700;letter-spacing:-.018em;line-height:1.12}

/* ---------- Efeitos Tech (montam e somem) ---------- */
.fxgrid{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background-image:linear-gradient(rgba(212,175,55,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.2) 1px,transparent 1px);
  background-size:111u 111u;background-position:center center;
  -webkit-mask-image:radial-gradient(60% 70% at 50% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(60% 70% at 50% 50%,#000 20%,transparent 75%)}
.cream .fxgrid{background-image:linear-gradient(rgba(138,109,22,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(138,109,22,.22) 1px,transparent 1px)}
.slide.on .fxgrid{animation:fxgrid 2.8s var(--ease2) .15s forwards}
@keyframes fxgrid{0%{opacity:0;clip-path:inset(0 100% 0 0)}28%{opacity:1;clip-path:inset(0 0 0 0)}55%{opacity:.8}100%{opacity:0;clip-path:inset(0 0 0 0)}}
.fxscan{position:absolute;left:0;right:0;top:0;height:1px;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.slide.on .fxscan{animation:fxscan 1.9s var(--ease2) .2s forwards}
@keyframes fxscan{0%{opacity:0;transform:translateY(8vh)}15%{opacity:.9}85%{opacity:.6}100%{opacity:0;transform:translateY(92vh)}}
/* contorno dourado que se desenha no card e some */
.tc{position:relative}
.tc::after{content:"";position:absolute;inset:0;border:1.5px solid var(--gold);border-radius:inherit;opacity:0;pointer-events:none}
.slide.on .tc::after{animation:tcline 2s var(--ease2) forwards;animation-delay:calc(var(--d,0) * 1s + .35s)}
@keyframes tcline{0%{opacity:1;clip-path:inset(0 100% 100% 0)}45%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
/* traço SVG que se desenha (pathLength=1) */
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.on .draw{animation:draw 1.3s var(--ease2) forwards;animation-delay:calc(var(--d,0) * 1s + .4s)}
@keyframes draw{to{stroke-dashoffset:0}}
.drawfade{stroke-dasharray:1;stroke-dashoffset:1;opacity:1}
.slide.on .drawfade{animation:draw 1.2s var(--ease2) forwards,fadeout .9s var(--ease) forwards;animation-delay:calc(var(--d,0) * 1s + .4s),calc(var(--d,0) * 1s + 1.8s)}
@keyframes fadeout{to{opacity:0}}

/* ---------- Rodapé ---------- */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:10;pointer-events:none;height:100u;display:flex;align-items:center;justify-content:space-between;
  width:min(100%,var(--frame));margin:0 auto;padding:0 var(--pad);font-size:18u;letter-spacing:.04em;color:var(--mut);opacity:.75;transition:opacity .6s,color .6s}
#foot.hide,body.vidon #foot{opacity:0}
#foot.dk{color:rgba(20,20,22,.6)}
#foot .num{font-variant-numeric:tabular-nums;transition:opacity .4s}

/* ---------- Interface do operador (aparece só com o mouse) ---------- */
#hud{position:fixed;left:50%;bottom:24u;transform:translateX(-50%);z-index:20;display:flex;gap:8u;opacity:0;transition:opacity .5s}
body:not(.idle) #hud{opacity:.6}
#hud i{width:10u;height:10u;border-radius:50%;background:rgba(143,138,130,.35);cursor:pointer}
#hud i.on{background:var(--gold)}
.ctl{position:fixed;bottom:22u;z-index:20;font-family:var(--sans);font-size:18u;font-weight:600;padding:9u 18u;border-radius:999px;border:1px solid rgba(212,175,55,.35);background:rgba(20,20,22,.85);color:var(--cream);cursor:pointer;opacity:0;transition:opacity .5s}
body:not(.idle) .ctl{opacity:.9}
#presBtn{left:28u} #fsBtn{right:28u}
#hint{position:fixed;left:50%;top:26u;transform:translateX(-50%);text-align:center;line-height:1.6;z-index:30;font-size:18u;letter-spacing:.06em;color:var(--mut);background:rgba(20,20,22,.9);border:1px solid var(--line);padding:10u 22u;border-radius:999px;transition:opacity 1s}
#hint.gone{opacity:0;pointer-events:none}
#pvtoast{position:fixed;left:50%;top:30u;transform:translate(-50%,-160%);z-index:60;background:var(--bg2);border:1px solid var(--gold);color:var(--cream);font-size:22u;padding:18u 28u;border-radius:16u;max-width:80vw;transition:transform .5s var(--ease)}
#pvtoast.show{transform:translate(-50%,0)}
#pvtoast a{color:var(--gold);font-weight:700}
</style>
<style>
/* =================== SLIDES =================== */
/* fotos à direita (capa, bio, quem sou, família) */
.photo{position:absolute;right:0;top:0;bottom:0;z-index:1;width:min(48vw,calc(var(--u)*1000 * .86));
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.slide.on .photo img{animation:photoin 2.4s var(--ease) both}
@keyframes photoin{from{opacity:0;transform:scale(1.06);filter:blur(10u) brightness(.6)}to{opacity:1;transform:none;filter:none}}
.withphoto .frame{padding-right:calc(min(48vw,calc(var(--u)*1000 * .86)) * .74)}

/* 1 · capa */
#s-capa h1{font-size:109u;line-height:1.08;margin-top:22u}
#s-capa .sub{font-size:57u;margin-top:30u}
#s-capa .who{font-weight:700;font-size:27u;letter-spacing:.32em;margin-top:150u}
#s-capa .k{font-size:25u}
/* Logo do cliente (edições personalizadas): só na capa, abaixo do nome */
#s-capa .clogo{display:flex;align-items:center;gap:34u;margin-top:64u}
#s-capa .clogo i{display:block;width:70u;height:1px;background:var(--gold,#D4AF37);opacity:.7}
#s-capa .clogo img{display:block;height:var(--lh,110u);max-width:560u;width:auto;object-fit:contain}

/* vídeo */
.vid .body{align-items:center;justify-content:center}
.play{width:160u;height:160u;border-radius:30u;background:var(--gold);display:grid;place-items:center;color:var(--bg)}
.play svg{width:58u;height:58u;margin-left:8u}
.vid .lbl{margin-top:44u;font-weight:700;font-size:27u;letter-spacing:.32em;color:var(--mut)}

/* vídeo do YouTube: entra por cima do card de play, em tela cheia, e some ao terminar */
.vid .yt{position:absolute;inset:0;z-index:5;background:#000;opacity:0;visibility:hidden;transition:opacity 1.2s var(--ease),visibility 0s 1.2s}
.vid.playing .yt{opacity:1;visibility:visible;transition:opacity 1.2s var(--ease) .2s,visibility 0s}
.vid.ended .yt{opacity:0;visibility:hidden}
.vid .yt iframe{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));transform:translate(-50%,-50%);border:0;pointer-events:none}

/* 3 · livro */
#s-livro .bgimg{position:absolute;inset:0;z-index:0;display:flex;justify-content:center;background:var(--deep)}
#s-livro .bgimg img{width:100%;height:106%;margin-top:-6%;object-fit:cover;object-position:50% 40%}
#s-livro .shade{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:1;background:linear-gradient(transparent,var(--deep) 70%)}
#s-livro .body{justify-content:flex-end}
#s-livro h2{font-size:57u;margin-top:18u}
#s-livro.on .bgimg img{animation:livro 3.2s var(--ease) both}
@keyframes livro{from{opacity:0;transform:scale(1.08);filter:blur(14u) brightness(.4)}to{opacity:1;transform:none;filter:none}}

/* 4 · 3 perguntas */
#s-3p .body{flex-direction:row;align-items:center;gap:80u}
#s-3p .big{font-size:494u;font-weight:700;line-height:.8;color:var(--gold);letter-spacing:-.04em}
#s-3p .vl{width:2px;height:420u;background:var(--gold);transform-origin:top;transform:scaleY(0);opacity:.9}
#s-3p.on .vl{animation:vline 2.4s var(--ease2) .5s forwards}
@keyframes vline{0%{transform:scaleY(0);opacity:.9}45%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(1);opacity:0}}
#s-3p p{font-size:79u;line-height:1.2;max-width:1150u}

/* 5-7 · perguntas */
.perg .top{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:14u}
.dots i{width:18u;height:18u;border-radius:5u;background:var(--line);transition:background .8s var(--ease) .9s}
.slide.on .dots i.a{background:var(--gold)}
.perg .num{font-size:198u;font-weight:700;color:var(--gold);line-height:1;letter-spacing:-.02em}
.perg .hl{height:2px;background:linear-gradient(90deg,var(--gold),transparent);width:900u;margin:26u 0 40u;transform-origin:left;transform:scaleX(0)}
.perg.on .hl{animation:hline 2.6s var(--ease2) .6s forwards}
@keyframes hline{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.perg h2{font-size:89u;max-width:1600u}

/* frases centrais */
.stmt .body{align-items:center;text-align:center;justify-content:center}
#s-p1 h2{font-size:217u;color:var(--gold)}
#s-p2 h2,#s-p3 h2{font-size:178u}

/* 11 · bio */
#s-bio h2{font-size:74u;margin-top:24u}
#s-bio .facts{display:grid;grid-template-columns:repeat(2,minmax(0,560u));column-gap:60u;row-gap:44u;margin-top:70u}
#s-bio .facts li{list-style:none;display:flex;gap:22u;align-items:flex-start;font-size:32u;line-height:1.35}
#s-bio .facts li::before{content:"";flex:0 0 auto;width:13u;height:13u;margin-top:13u;border-radius:3u;background:var(--gold)}

/* cards escuros com números */
.cards{display:grid;gap:28u}
.card{background:var(--bg2);border-radius:20u;padding:44u 40u}
.card .n{font-weight:700;color:var(--gold);line-height:1;white-space:nowrap}
.card .l{font-size:30u;line-height:1.35;margin-top:24u}
#s-lab h2{font-size:54u;margin-top:24u}
#s-lab .cards{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:90u}
#s-lab .card{min-height:410u;display:flex;flex-direction:column;justify-content:center}
#s-lab .card .n{font-size:79u}
#s-lab .card .n.sm{font-size:56u}

/* 13 · empresas */
#s-emp .logos{display:flex;flex-wrap:wrap;justify-content:center;gap:70u 90u;margin:auto;max-width:1700u}
#s-emp .lg{flex:0 0 330u;height:110u;display:grid;place-items:center;color:#fff}
#s-emp .lg svg,#s-emp .lg img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
#s-emp .lg.s svg{height:78%}

/* 14 · quem sou */
#s-quem h2{font-size:99u;max-width:1000u}
#s-quem .photo img{object-position:50% 20%}

/* 15 · chevette */
.ic{display:inline-grid;place-items:center;color:var(--gold)}
.ic svg{width:100%;height:100%}
#s-chev .ic{width:120u;height:86u;margin-top:50u}
#s-chev blockquote{font-size:84u;line-height:1.22;margin-top:44u;max-width:1550u}
#s-chev .cap{font-size:32u;margin-top:44u}

/* slides dourados */
.goldbg .body{justify-content:center}
.goldbg h2{color:var(--bg);font-size:99u;max-width:1550u}
.goldbg h2.serif{font-weight:500;line-height:1.18}
.goldbg.ctr .body{align-items:center;text-align:center}
#s-hist h2{font-size:128u}
#s-agua h2{font-size:133u}
#s-dom h2{font-size:124u}
#s-energia h2{font-size:119u}
#s-ocupa h2{font-size:94u}

/* 17 */
.lead{font-size:94u;max-width:1600u}

/* 18 · 160 */
#s-160 .body{flex-direction:row;align-items:center;gap:90u}
#s-160 .left{flex:1 1 0}
#s-160 .big{font-size:321u;font-weight:700;color:var(--gold);line-height:.9;letter-spacing:-.03em}
#s-160 .cap{font-size:40u;font-weight:700;margin-top:34u;max-width:640u;line-height:1.3}

/* 19 · virada */

#s-vir .card .n{font-size:64u}
#s-vir .card .n.xl{font-size:133u}
#s-vir .card .l{font-size:32u}

/* 20 */
#s-mesmas h2{font-size:79u;line-height:1.3}
#s-mesmas h2 span{display:block}

/* 22-26 · quem é você */

/* 28 · 6 poderes (fundo creme) */
.cream .h{color:var(--bg)}

/* 31 · sétimo */

#s-7 h2{font-size:148u;margin-top:10u}

/* 33-38 · pilares + mão */
#s-pil .body{position:relative;display:block}
